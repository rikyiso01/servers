services:
  caddy-tunnel-https:
    image: docker.io/jnovack/autossh:latest
    container_name: "caddy-tunnel-https"
    environment:
      SSH_REMOTE_USER: "$TUNNEL_USER"
      SSH_REMOTE_HOST: "$HETZNER"
      SSH_REMOTE_PORT: "$TUNNEL_PORT"
      SSH_TUNNEL_PORT: "8080"
      SSH_TARGET_HOST: caddy
      SSH_TARGET_PORT: "80"
      SSH_KEY_FILE: /key/id_ed25519
      SSH_BIND_IP: "0.0.0.0"
    restart: always
    networks:
      - caddy-tunnel
    volumes:
      - tunnel-key:/key:ro

  caddy:
    networks:
      - caddy-tunnel

networks:
  caddy-tunnel:

volumes:
  tunnel-key:
    name: "tunnel-key"
