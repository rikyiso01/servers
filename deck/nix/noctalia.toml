[theme]
mode = "dark"

[bar.default]
position = "top"
start = ["workspaces"]
center = ["clock"]
end = ["volume", "brightness", "battery", "network"]

[audio]
enable_overdrive = true

[widget.clock]
format = "%a, %d %b, %H:%M"

[location]
auto_locate = true

[calendar]
enabled = false

[nightlight]
enabled = true
force = true
temperature_day = 3700
temperature_night = 3700

[hooks]
started="pamixer --allow-boost --set-volume 150; noctalia msg brightness-set 30%"
